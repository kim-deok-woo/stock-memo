<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관심 종목 메모</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 0 auto; padding: 16px; background: #f6f8fa; }
  h1 { font-size: 24px; }
  form { display: grid; gap: 8px; background: #fff; padding: 12px; border-radius: 8px; }
  input, textarea, button { font-size: 16px; padding: 8px; }
  button { background: #2da44e; color: #fff; border: 0; border-radius: 6px; }
  .memo { background: #fff; margin-top: 10px; padding: 12px; border-radius: 8px; }
  .memo h3 { margin: 0 0 6px; }
  .memo small { color: #666; }
  .tag { display:inline-block; font-size:13px; padding:2px 8px; border-radius:10px; color:#fff; margin-left:6px; }
  .보유 { background:#0969da; } .후보 { background:#bf8700; }
  .del { background: #cf222e; float: right; padding: 4px 8px; }
</style>
</head>
<body>
  <h1>📈 관심 종목 메모</h1>
  <form id="form">
    <input id="name" placeholder="종목 이름 (예: 삼성전자)" required>
    <textarea id="note" placeholder="왜 관심 있는지 메모" rows="3"></textarea>
    <button>추가</button>
  </form>
  <h2>내 종목 (노션 투자 아카이브 기준)</h2>
  <div id="fixed"></div>
  <h2>추가 메모</h2>
  <div id="list"></div>
<script>
  // 메모는 이 브라우저 안(localStorage)에만 저장됩니다. 인터넷에 올라가지 않아요.
  const KEY = "stock-memos";
  const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const save = (memos) => localStorage.setItem(KEY, JSON.stringify(memos));

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    load().forEach((m, i) => {
      const div = document.createElement("div");
      div.className = "memo";
      div.innerHTML = `<button class="del" data-i="${i}">삭제</button>
        <h3></h3><p></p><small>${m.date}</small>`;
      div.querySelector("h3").textContent = m.name;
      div.querySelector("p").textContent = m.note;
      list.appendChild(div);
    });
  }

  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const memos = load();
    memos.unshift({
      name: document.getElementById("name").value,
      note: document.getElementById("note").value,
      date: new Date().toLocaleDateString("ko-KR"),
    });
    save(memos);
    e.target.reset();
    render();
  });

  document.getElementById("list").addEventListener("click", (e) => {
    if (!e.target.classList.contains("del")) return;
    const memos = load();
    memos.splice(Number(e.target.dataset.i), 1);
    save(memos);
    render();
  });

  // 노션 '투자 아카이브' ⑧ 실적 표(2026 3Q)를 바탕으로 넣은 고정 목록입니다.
  const MY_STOCKS = [
    { name: "알파벳", type: "보유", note: "클라우드·TPU와 검색 AI가 장기 성장 논리. 대규모 투자가 실적으로 이어지는지 확인 필요." },
    { name: "테슬라", type: "보유", note: "단기 실적은 정체지만 로보택시·FSD 확대와 옵티머스 생산 시작으로 자율주행·로보틱스 논리가 실행 단계." },
    { name: "스페이스X", type: "보유", note: "스타링크의 높은 이익률과 AI 부문 성장이 성장 축. 설비투자가 매우 커서 현금창출력도 함께 봐야 함." },
    { name: "TSMC", type: "후보", note: "첨단 공정 수요가 강하고 2나노 확대 중. AI·고성능 연산 파운드리 논리. 2나노 초기 이익률 희석은 체크." },
  ];
  function renderFixed() {
    const box = document.getElementById("fixed");
    MY_STOCKS.forEach((m) => {
      const div = document.createElement("div");
      div.className = "memo";
      div.innerHTML = `<h3></h3><p></p>`;
      div.querySelector("h3").textContent = m.name;
      const tag = document.createElement("span");
      tag.className = "tag " + m.type;
      tag.textContent = m.type;
      div.querySelector("h3").appendChild(tag);
      div.querySelector("p").textContent = m.note;
      box.appendChild(div);
    });
  }

  renderFixed();
  render();
</script>
</body>
</html>
